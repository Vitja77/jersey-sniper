name: Jersey Sniper
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min
  workflow_dispatch:                # "Run workflow" button
permissions:
  contents: write
concurrency:
  group: snipe
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - run: pip install -q -r requirements.txt
      - run: python sniper.py once -v
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Save seen-list (also keeps the schedule alive)
        if: always()
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git add -f data/seen.sqlite
          git commit -qm "update seen list" || exit 0
          git pull -q --rebase && git push -q
